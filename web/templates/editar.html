<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar zona - {{ camera.nome }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #222; }
        #container { position: relative; display: inline-block; border: 2px solid #333; }
        #imagem { display: block; max-width: 100%; }
        #tela { position: absolute; top: 0; left: 0; cursor: crosshair; }
        .instrucoes { background: #fff3cd; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        .config-extra { background: white; padding: 16px; border-radius: 8px; margin-top: 16px; }
        .config-extra label { display: block; margin: 10px 0 4px; font-weight: bold; }
        .config-extra select, .config-extra input[type=number] { padding: 6px; border-radius: 6px; border: 1px solid #ccc; }
        button.salvar { background: #16a34a; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 16px; font-size: 15px; }
        a.voltar { display: inline-block; margin-bottom: 16px; color: #2563eb; }
    </style>
</head>
<body>
    <a class="voltar" href="{{ url_for('index') }}">&larr; Voltar</a>
    <h1>Editar zona: {{ camera.nome }}</h1>

    <div class="instrucoes">
        Clique e arraste na imagem abaixo para desenhar o retângulo da zona de perigo.
    </div>

    <div id="container">
        <img id="imagem" src="{{ url_for('snapshot', indice=indice) }}" alt="Imagem da câmera">
        <canvas id="tela"></canvas>
    </div>

    <form method="POST" action="{{ url_for('salvar', indice=indice) }}" id="form-salvar">
        <input type="hidden" name="x1" id="x1" value="{{ camera.zona[0] }}">
        <input type="hidden" name="y1" id="y1" value="{{ camera.zona[1] }}">
        <input type="hidden" name="x2" id="x2" value="{{ camera.zona[2] }}">
        <input type="hidden" name="y2" id="y2" value="{{ camera.zona[3] }}">

        <div class="config-extra">
            <label>O que verificar</label>
            <select name="modo_deteccao">
                <option value="pes" {% if camera.modo_deteccao == "pes" %}selected{% endif %}>Só os pés (mais preciso pra "pisar em algo")</option>
                <option value="corpo" {% if camera.modo_deteccao == "corpo" %}selected{% endif %}>Corpo inteiro</option>
            </select>

            <label>
                <input type="checkbox" name="pular_frames" {% if camera.pular_frames %}checked{% endif %}>
                Pular frames (mais rápido, menos preciso)
            </label>

            <label>Processar 1 a cada quantos frames</label>
            <input type="number" name="quantidade_pular_frames" min="1" value="{{ camera.quantidade_pular_frames }}">
        </div>

        <button class="salvar" type="submit">Salvar</button>
    </form>

    <script>
        const imagem = document.getElementById("imagem");
        const tela = document.getElementById("tela");
        const ctx = tela.getContext("2d");

        let desenhando = false;
        let inicioX, inicioY;

        function configurarTela() {
            tela.width = imagem.width;
            tela.height = imagem.height;
            desenharZonaAtual();
        }

        function desenharZonaAtual() {
            ctx.clearRect(0, 0, tela.width, tela.height);
            const x1 = parseInt(document.getElementById("x1").value);
            const y1 = parseInt(document.getElementById("y1").value);
            const x2 = parseInt(document.getElementById("x2").value);
            const y2 = parseInt(document.getElementById("y2").value);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        }

        imagem.onload = configurarTela;
        if (imagem.complete) configurarTela();

        tela.addEventListener("mousedown", (e) => {
            const rect = tela.getBoundingClientRect();
            inicioX = e.clientX - rect.left;
            inicioY = e.clientY - rect.top;
            desenhando = true;
        });

        tela.addEventListener("mousemove", (e) => {
            if (!desenhando) return;
            const rect = tela.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.clearRect(0, 0, tela.width, tela.height);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;
            ctx.strokeRect(inicioX, inicioY, x - inicioX, y - inicioY);
        });

        tela.addEventListener("mouseup", (e) => {
            if (!desenhando) return;
            desenhando = false;
            const rect = tela.getBoundingClientRect();
            const fimX = e.clientX - rect.left;
            const fimY = e.clientY - rect.top;

            const escalaX = imagem.naturalWidth / tela.width;
            const escalaY = imagem.naturalHeight / tela.height;

            const x1 = Math.round(Math.min(inicioX, fimX) * escalaX);
            const y1 = Math.round(Math.min(inicioY, fimY) * escalaY);
            const x2 = Math.round(Math.max(inicioX, fimX) * escalaX);
            const y2 = Math.round(Math.max(inicioY, fimY) * escalaY);

            document.getElementById("x1").value = x1;
            document.getElementById("y1").value = y1;
            document.getElementById("x2").value = x2;
            document.getElementById("y2").value = y2;
        });
    </script>
</body>
</html>
